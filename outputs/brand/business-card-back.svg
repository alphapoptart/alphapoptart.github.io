<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="2in" viewBox="0 0 1050 600" role="img" aria-labelledby="title desc">
  <title id="title">Northstar Tech Concierge business card back</title>
  <desc id="desc">Professional contact card with a QR code linking to the Northstar website.</desc>
  <rect width="1050" height="600" rx="18" fill="#f7f8f4"/>
  <rect width="28" height="600" fill="#ccf265"/>
  <rect x="28" width="8" height="600" fill="#18a999"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#102b35">
    <text x="88" y="108" font-size="22" letter-spacing="4" font-weight="700" fill="#18a999">SEAN WIDNER  /  TECH CONCIERGE</text>
    <text x="88" y="205" font-size="46" font-weight="700">Technology,</text>
    <text x="88" y="260" font-size="46" font-weight="700">made human.</text>
    <line x1="88" y1="300" x2="610" y2="300" stroke="#dbe3de" stroke-width="3"/>
    <text x="88" y="360" font-size="27" font-weight="700">(352) 875-0467</text>
    <text x="88" y="405" font-size="22" fill="#40525a">alphapoptart.github.io</text>
    <text x="88" y="472" font-size="20" fill="#40525a">Appointments by phone, video, or in person.</text>
    <text x="88" y="525" font-size="17" letter-spacing="1.5" fill="#18a999">SCAN TO VISIT NORTHSTAR ONLINE</text>
  </g>
  <g transform="translate(770 128)">
    <rect x="-22" y="-22" width="250" height="250" rx="18" fill="#102b35"/>
    <rect x="-8" y="-8" width="222" height="222" rx="8" fill="#fff"/>
    <image href="data:image/png;base64," x="8" y="8" width="198" height="198"/>
    <text x="103" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#102b35">OPEN THE SITE</text>
  </g>
</svg>
